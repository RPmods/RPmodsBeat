<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cherry Beat · Character Lab 0.36</title><style>
*{box-sizing:border-box}body{margin:0;background:#15182a;color:#f1eafa;font:15px system-ui}main{max-width:1100px;margin:auto;padding:20px}h1{margin:0;font-size:clamp(24px,4vw,38px)}p{color:#b8bfd7;line-height:1.5}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin:16px 0}label{display:grid;gap:5px;min-width:0}select,button,input{font:inherit;color:inherit;background:#30344e;border:1px solid #716b9b;border-radius:8px;padding:9px;min-width:0;max-width:100%}button{cursor:pointer}section{padding:12px;background:#20243b;border-radius:14px;margin:14px 0}.cast{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.card{background:#14192c;border:1px solid #4f5576;border-radius:10px;text-align:center;padding:5px}.art{position:relative;aspect-ratio:1;min-height:0;background-repeat:no-repeat;background-position:center;background-size:contain;overflow:hidden}.art.motion-ready{background-image:none!important}.art svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.preview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.preview .art{max-width:440px;width:100%;margin:auto;background:radial-gradient(ellipse at center,#303651,#192038);border-radius:10px}.tag{font-size:12px;color:#e9c3f0}#time{font-variant-numeric:tabular-nums}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#seek{flex:1}button:focus-visible,select:focus-visible{outline:2px solid #ecb4e6}@media(max-width:520px){.preview{grid-template-columns:1fr}.cast{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main><h1>Character Lab · Alpha 0.36</h1><p>Vista de los mismos assets y motor que usa el juego. No necesita Firebase, audio ni recursos externos.</p><section><div id="cast" class="cast"></div></section><section><div class="row"><label>Personaje<select id="character"></select></label><label>Cabello<select id="hair"></select></label><label>Ropa<select id="cloth"></select></label><label>Ojos<select id="eyes"></select></label><label>Accesorio<select id="accessory"></select></label><label>Animación<select id="action"></select></label></div><div class="preview"><div><div id="original" class="art"></div><p class="tag">Pose neutral · mismo diseño y cosméticos</p></div><div><div id="animated" class="art"></div><p class="tag">Animación · mismos materiales</p></div></div><div class="bar"><button id="play">Pausar</button><button id="restart">Reiniciar</button><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Tiempo de animación"><span id="time">0.00 s</span><button id="reset">Restaurar colores</button></div><p id="info"></p></section></main>
<script src="assets/characters36/art.js"></script><script src="assets/characters36/poses.js"></script><script src="motion.js"></script><script>
'use strict';const $=id=>document.getElementById(id),A=CBArt36,P=CBPoses36,E=CherryMotion;let time=0,last=0,playing=true,stamp=0,settings={};
function opts(id,values){$(id).replaceChildren(...values.map(([v,t])=>new Option(t||v,v)))}
opts('character',Object.entries(A.cast).map(([k,v])=>[k,v.name]));opts('hair',[['original','Original'],...Object.keys(A.hair).map(v=>[v])]);opts('cloth',[['original','Original'],...Object.keys(A.cloth).map(v=>[v])]);opts('eyes',[['original','Original'],...Object.keys(A.eyes).map(v=>[v])]);opts('accessory',[['original','Sin accesorio'],...['crown','moon','heart','notes','bow','aura','fx-legend-nebula','fx-legend-rose','fx-legend-midnight','fx-epic-ocean','fx-epic-dream','fx-exotic-galaxy','fx-zomby-starmap','fx-zomby-void','fx-zomby-astral','fx-zomby-night','fx-zomby-nexus'].map(v=>[v])]);opts('action',P.actions.map(v=>[v]));$('action').value='idle-breathe';
for(const [c,d] of Object.entries(A.cast)){const card=document.createElement('button'),art=document.createElement('div'),name=document.createElement('div');card.className='card';art.className='art';name.textContent=d.name;E.applyStatic(art,c);card.append(art,name);card.onclick=()=>{$('character').value=c;change()};$('cast').append(card)}
function change(){settings=Object.fromEntries(['hair','cloth','eyes','accessory'].map(k=>[k,$(k).value]));const c=$('character').value;for(const k of ['cloth','accessory'])for(const o of $(k).options)o.disabled=o.value.includes('zomby-')&&c!=='zomby';for(const k of ['cloth','accessory'])if($(k).selectedOptions[0]?.disabled){$(k).value='original';settings[k]='original'}E.applyStatic($('original'),c,settings);E.mount($('animated'),c,settings);time=0;stamp++;last=0;show();$('info').textContent=A.cast[c].name+' · '+E.backend()+' · '+P.actions.length+' acciones';}
function show(){const a=$('action').value,d=P.durations[a],c=$('character').value;const i=E.mount($('animated'),c,settings),pose=P.sample(a,time,1,c);for(const [id,t] of Object.entries(P.transforms(pose)))i.parts.get(id)?.setAttribute('transform',t);for(const [id,v] of Object.entries(P.visibility(pose)))i.parts.get(id)?.setAttribute('display',v?'inline':'none');i.parts.get('actor').setAttribute('opacity',pose.alpha);$('seek').value=Math.round(time/d*1000);$('time').textContent=time.toFixed(2)+' / '+d.toFixed(2)+' s'}
for(const id of ['character','hair','cloth','eyes','accessory','action'])$(id).onchange=change;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pausar':'Reproducir';last=0};$('restart').onclick=()=>{time=0;last=0;show()};$('seek').oninput=()=>{playing=false;$('play').textContent='Reproducir';time=Number($('seek').value)/1000*P.durations[$('action').value];show()};$('reset').onclick=()=>{for(const k of ['hair','cloth','eyes','accessory'])$(k).value='original';change()};
function loop(now){requestAnimationFrame(loop);if(!playing)return;if(!last)last=now;const d=P.durations[$('action').value];time=(time+Math.min(.1,(now-last)/1000))%d;last=now;show()}change();requestAnimationFrame(loop);
</script></body></html>
