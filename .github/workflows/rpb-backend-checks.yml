name: RPB isolated Firebase emulator checks
on:
  pull_request:
    paths:
      - 'dev/alpha035/backend/**'
      - '.github/workflows/rpb-backend-checks.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dev/alpha035/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated backend dependencies
        run: npm install --no-audit --no-fund
      - name: Run local demo Firebase integration
        env:
          FIREBASE_AUTH_EMULATOR_HOST: '127.0.0.1:9099'
          FIREBASE_DATABASE_EMULATOR_HOST: '127.0.0.1:9000'
          GCLOUD_PROJECT: demo-rpb-alpha035
        run: npx --yes firebase-tools@14.12.0 emulators:exec --project demo-rpb-alpha035 --config firebase.emulator.json --only auth,database,functions "node emulator.test.cjs"
